name: Jonli tizimlar holati

on:
  schedule:
    - cron: "17 */6 * * *"   # har 6 soatda
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tekshir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Saytlarni tekshirish
        run: python3 skriptlar/holat.py
      - name: Panelni saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rasmlar/holat.svg
          git diff --cached --quiet || git commit -m "Jonli tizimlar holati yangilandi"
          git push
